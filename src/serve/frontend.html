<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>倪师辨证助手</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary: #0a4c6e;
    --primary-light: #2d82b5;
    --accent: #f4e4c1;
    --bg: #faf7f0;
    --surface: #ffffff;
    --border: #e0d5b8;
    --text: #3a3a3a;
    --text-secondary: #888888;
    --text-tertiary: #b0a890;
    --danger: #c0392b;
    --font-serif: 'Noto Serif SC', 'Songti SC', Georgia, serif;
    --font-sans: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --shadow-card: 0 1px 3px rgba(10, 76, 110, 0.06);
    --shadow-hover: 0 2px 8px rgba(10, 76, 110, 0.10);
    --radius: 16px;
  }

  html, body { height: 100%; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ── 顶栏 ── */
  .topbar {
    flex-shrink: 0;
    background: rgba(250, 247, 240, 0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand h1 {
    font-family: var(--font-serif);
    font-size: 18px;
    font-weight: 700;
    color: var(--primary);
    letter-spacing: 1px;
  }
  .brand .tagline {
    font-size: 12px;
    color: var(--text-tertiary);
  }
  .status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--primary-light);
    animation: pulse 2s infinite;
  }
  .status-dot.offline { background: var(--danger); animation: none; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* ── 免责条 ── */
  .disclaimer {
    flex-shrink: 0;
    text-align: center;
    font-size: 12px;
    color: var(--text-tertiary);
    padding: 6px 16px;
    background: var(--accent);
    border-bottom: 1px solid var(--border);
  }

  /* ── 聊天区 ── */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 28px 24px;
    scroll-behavior: smooth;
  }
  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .message {
    display: flex;
    gap: 10px;
    max-width: 76%;
    margin-bottom: 18px;
    animation: msgIn 0.3s ease-out;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .message.ai { align-self: flex-start; }
  .message.user { align-self: flex-end; flex-direction: row-reverse; }

  .msg-avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
  }
  .message.ai .msg-avatar { background: var(--primary-light); color: #fff; }
  .message.user .msg-avatar { background: var(--border); color: var(--text); }

  .bubble {
    padding: 12px 18px;
    font-size: 14px;
    line-height: 1.8;
    color: var(--text);
    word-break: break-word;
  }
  .message.ai .bubble {
    background: var(--surface);
    border-radius: 16px 16px 16px 4px;
    box-shadow: var(--shadow-card);
  }
  .message.user .bubble {
    background: var(--accent);
    border-radius: 16px 16px 4px 16px;
  }
  .bubble.error-bubble { color: var(--danger); }

  /* typing */
  .typing { display: inline-flex; gap: 4px; padding: 6px 2px; }
  .typing span {
    width: 6px; height: 6px;
    background: var(--text-tertiary);
    border-radius: 50%;
    animation: typingDot 1.4s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typingDot {
    0%, 60%, 100% { opacity: 0.3; transform: scale(1); }
    30% { opacity: 1; transform: scale(1.3); }
  }

  /* 辨证回答层标题 */
  .layer {
    display: inline-block;
    margin: 10px 0 4px;
    padding: 2px 12px;
    border-radius: 9999px;
    font-size: 12px;
    font-weight: 600;
    color: #fff;
    font-family: var(--font-sans);
  }
  .layer-diag { background: var(--primary); }
  .layer-family { background: #a9712c; }
  .layer-guide { background: var(--primary-light); }
  .layer-tip { background: #5a7d52; }
  .layer-care { background: var(--danger); }

  /* 追问卡片 */
  .diag-card {
    margin-top: 6px;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
  }
  .diag-title { font-size: 14px; font-weight: 600; margin-bottom: 10px; color: var(--primary); }
  .diag-options { display: flex; flex-wrap: wrap; gap: 8px; }
  .diag-option {
    padding: 7px 18px;
    border: 1px solid var(--primary-light);
    border-radius: 9999px;
    background: var(--surface);
    color: var(--primary);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--font-sans);
  }
  .diag-option:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
  .diag-hint { margin-top: 8px; font-size: 11px; color: var(--text-tertiary); }

  /* ── 欢迎卡 ── */
  .welcome {
    max-width: 560px;
    margin: 40px auto;
    text-align: center;
    animation: msgIn 0.5s ease-out;
  }
  .welcome .seal {
    width: 64px; height: 64px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
  }
  .welcome h2 {
    font-family: var(--font-serif);
    font-size: 26px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 8px;
    letter-spacing: 2px;
  }
  .welcome p { font-size: 14px; color: var(--text-secondary); margin-bottom: 24px; }
  .welcome .suggestions { display: flex; flex-direction: column; gap: 10px; }
  .welcome .suggestion-btn {
    padding: 12px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
    box-shadow: var(--shadow-card);
  }
  .welcome .suggestion-btn:hover {
    border-color: var(--primary-light);
    box-shadow: var(--shadow-hover);
    color: var(--primary);
  }

  /* ── 输入区 ── */
  .input-bar {
    flex-shrink: 0;
    padding: 14px 24px 20px;
    background: linear-gradient(transparent, var(--bg) 30%);
  }
  .input-form {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 9999px;
    padding: 6px 6px 6px 20px;
    box-shadow: var(--shadow-card);
    transition: border-color 0.2s;
  }
  .input-form:focus-within { border-color: var(--primary-light); }
  .input-form input {
    flex: 1;
    border: none;
    outline: none;
    font-family: var(--font-sans);
    font-size: 14px;
    color: var(--text);
    background: transparent;
  }
  .input-form button {
    border: none;
    border-radius: 9999px;
    padding: 9px 24px;
    background: var(--primary);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: var(--font-sans);
  }
  .input-form button:hover { background: var(--primary-light); }
  .input-form button:disabled { opacity: 0.5; cursor: default; }

  @media (max-width: 640px) {
    .message { max-width: 88%; }
    .brand .tagline { display: none; }
    .chat-area { padding: 20px 14px; }
  }
</style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <h1>倪师辨证助手</h1>
      <span class="tagline">伤寒论 · 倪海厦人纪</span>
    </div>
    <div class="status">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">连接中…</span>
    </div>
  </header>

  <div class="disclaimer">仅供中医经典知识学习参考，不构成诊疗建议。急重症请立即就医。</div>

  <main class="chat-area" id="chat-area">
    <div class="welcome" id="welcome">
      <div class="seal">🌿</div>
      <h2>说说您哪里不舒服</h2>
      <p>描述症状，为您判断辨证方向、给出调理建议</p>
      <div class="suggestions" id="welcome-suggestions"></div>
    </div>
  </main>

  <footer class="input-bar">
    <form class="input-form" id="input-form">
      <input type="text" id="question-input" placeholder="例如：头痛、怕冷、不出汗…" autocomplete="off" autofocus>
      <button type="submit" id="submit-btn">发送</button>
    </form>
  </footer>

  <script>
    const chatArea = document.getElementById('chat-area');
    const inputForm = document.getElementById('input-form');
    const questionInput = document.getElementById('question-input');
    const submitBtn = document.getElementById('submit-btn');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const welcome = document.getElementById('welcome');
    const welcomeSuggestions = document.getElementById('welcome-suggestions');

    // ── 健康检查 ──
    fetch('/api/health')
      .then(r => r.json())
      .then(() => {
        statusText.textContent = '在线';
        statusDot.classList.remove('offline');
      })
      .catch(() => {
        statusText.textContent = '离线';
        statusDot.classList.add('offline');
      });

    // ── 示例问题 ──
    fetch('/api/examples')
      .then(r => r.json())
      .then(data => {
        data.examples.forEach(ex => {
          const btn = document.createElement('div');
          btn.className = 'suggestion-btn';
          btn.textContent = ex.question;
          btn.addEventListener('click', () => {
            questionInput.value = ex.question;
            inputForm.dispatchEvent(new Event('submit'));
          });
          welcomeSuggestions.appendChild(btn);
        });
      });

    // ── Markdown 渲染（基础） ──
    function renderMarkdown(text) {
      let html = text
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/```([\s\S]*?)```/g, (m, c) => `<pre>${c.trim()}</pre>`)
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      // 辨证回答层标题 → 胶囊徽章
      html = html.replace(/【(辨证方向|类方思路|倪师讲解|调理建议|就医引导)】/g, (m, p1) => {
        const cls = {
          '辨证方向': 'layer layer-diag',
          '类方思路': 'layer layer-family',
          '倪师讲解': 'layer layer-guide',
          '调理建议': 'layer layer-tip',
          '就医引导': 'layer layer-care',
        }[p1] || 'layer';
        return `<div class="${cls}">${p1}</div>`;
      });
      html = html.replace(/\n/g, '<br>');
      return html;
    }

    // ── 追问卡片 ──
    function renderClarification(diag, originalQuestion) {
      const opts = (diag.options || []).map(o =>
        `<button class="diag-option" data-answer="${escapeHtml(o)}">${escapeHtml(o)}</button>`
      ).join('');
      const card = document.createElement('div');
      card.className = 'diag-card';
      card.innerHTML = `
        <div class="diag-title">${escapeHtml(diag.question || '请补充一点信息')}</div>
        <div class="diag-options">${opts}</div>
        <div class="diag-hint">${opts ? '点击选项继续' : '请补充描述，例如：有/没有出汗、怕冷还是怕热…'}</div>`;
      card.querySelectorAll('.diag-option').forEach(btn => {
        btn.addEventListener('click', () => {
          const followup = `${originalQuestion}，${btn.dataset.answer}`;
          questionInput.value = followup;
          inputForm.dispatchEvent(new Event('submit'));
        });
      });
      return card;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ── 发送消息 ──
    inputForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = questionInput.value.trim();
      if (!question || submitBtn.disabled) return;
      if (welcome) welcome.style.display = 'none';

      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      userMsg.innerHTML = `<div class="msg-avatar">你</div><div class="bubble">${escapeHtml(question)}</div>`;
      chatArea.appendChild(userMsg);

      questionInput.value = '';
      submitBtn.disabled = true;

      const aiMsg = document.createElement('div');
      aiMsg.className = 'message ai';
      aiMsg.innerHTML = `<div class="msg-avatar">🌿</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
      chatArea.appendChild(aiMsg);
      chatArea.scrollTop = chatArea.scrollHeight;

      const bubble = aiMsg.querySelector('.bubble');
      const aiMsgContent = aiMsg;

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question }),
        });

        if (!response.ok) {
          const err = await response.json().catch(() => ({ detail: '请求失败' }));
          bubble.className = 'bubble error-bubble';
          bubble.textContent = err.detail || '请求失败';
          return;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let answerText = '';
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            let data;
            try { data = JSON.parse(line.slice(6)); } catch { continue; }

            if (data.type === 'retrieved') {
              bubble._extras = data.context_extras;
              bubble._question = question;
              const diag = (data.context_extras || {}).diagnosis;
              if (diag && diag.status === 'need_clarification') {
                bubble._clarify = true;
              }
            } else if (data.type === 'chunk') {
              if (bubble._answerDone) continue;
              if (bubble._clarify) {
                bubble._clarify = false;
                bubble.innerHTML = '';
                const diag = (bubble._extras || {}).diagnosis;
                if (diag) bubble.appendChild(renderClarification(diag, bubble._question));
                bubble._answerDone = true;
              } else {
                answerText += data.content;
                bubble.innerHTML = renderMarkdown(answerText);
              }
            } else if (data.type === 'done') {
              if (!bubble._answerDone && !answerText) {
                bubble.textContent = '（无回答）';
              }
            } else if (data.type === 'error') {
              bubble.className = 'bubble error-bubble';
              bubble.textContent = data.message || '生成失败';
            }
          }
          chatArea.scrollTop = chatArea.scrollHeight;
        }
      } catch (err) {
        bubble.className = 'bubble error-bubble';
        bubble.textContent = '连接失败，请确认服务已启动';
      } finally {
        submitBtn.disabled = false;
        questionInput.focus();
        chatArea.scrollTop = chatArea.scrollHeight;
      }
    });

    questionInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        inputForm.dispatchEvent(new Event('submit'));
      }
    });
  </script>
</body>
</html>
