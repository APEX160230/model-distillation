<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>倪师辨证助手</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary: #0a4c6e;
    --primary-light: #2d82b5;
    --accent: #f4e4c1;
    --bg: #faf7f0;
    --surface: #ffffff;
    --border: #e0d5b8;
    --text: #3a3a3a;
    --text-secondary: #888888;
    --font-serif: 'Noto Serif SC', 'Songti SC', Georgia, serif;
    --font-sans: 'Noto Sans SC', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --shadow: 0 1px 3px rgba(10, 76, 110, 0.06);
  }

  html, body { height: 100%; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  header {
    flex-shrink: 0;
    padding: 14px 20px;
    text-align: center;
  }
  header h1 {
    font-family: var(--font-serif);
    font-size: 17px;
    font-weight: 700;
    color: var(--primary);
    letter-spacing: 2px;
  }

  /* 免责行 */
  .note {
    flex-shrink: 0;
    text-align: center;
    font-size: 11px;
    color: var(--text-secondary);
    padding: 4px 16px 10px;
  }

  /* 聊天区 */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px 8px;
  }
  .chat-area::-webkit-scrollbar { width: 3px; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .message {
    display: flex;
    gap: 8px;
    max-width: 82%;
    margin-bottom: 14px;
    animation: in 0.25s ease-out;
  }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }
  .message.ai { align-self: flex-start; }
  .message.user { align-self: flex-end; flex-direction: row-reverse; }

  .avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
  }
  .message.ai .avatar { background: var(--primary-light); color: #fff; }
  .message.user .avatar { background: var(--border); color: var(--text); }

  .bubble {
    padding: 10px 15px;
    font-size: 14px;
    line-height: 1.8;
    word-break: break-word;
  }
  .message.ai .bubble {
    background: var(--surface);
    border-radius: 14px 14px 14px 3px;
    box-shadow: var(--shadow);
  }
  .message.user .bubble { background: var(--accent); border-radius: 14px 14px 3px 14px; }
  .bubble.error { color: #c0392b; }

  .typing { display: inline-flex; gap: 4px; padding: 5px 2px; }
  .typing span {
    width: 5px; height: 5px;
    background: var(--text-secondary);
    border-radius: 50%;
    animation: dot 1.4s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dot { 0%,60%,100% { opacity: 0.3; } 30% { opacity: 1; } }

  /* 回答层标题（轻量小标） */
  .layer {
    display: block;
    margin: 10px 0 2px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .layer-diag { color: var(--primary); }
  .layer-family { color: #a9712c; }
  .layer-guide { color: var(--primary-light); }
  .layer-tip { color: #5a7d52; }
  .layer-care { color: #c0392b; }

  /* 追问卡片 */
  .diag-card { margin-top: 4px; }
  .diag-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--primary); }
  .diag-options { display: flex; flex-wrap: wrap; gap: 8px; }
  .diag-option {
    padding: 6px 16px;
    border: 1px solid var(--primary-light);
    border-radius: 999px;
    background: var(--surface);
    color: var(--primary);
    font-size: 13px;
    cursor: pointer;
    font-family: var(--font-sans);
  }
  .diag-option:hover { background: var(--primary); color: #fff; }
  .diag-hint { margin-top: 6px; font-size: 11px; color: var(--text-secondary); }

  /* 输入区 */
  .input-bar {
    flex-shrink: 0;
    padding: 10px 20px 18px;
    max-width: 640px;
    margin: 0 auto;
    width: 100%;
  }
  .input-form {
    display: flex;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 5px 5px 18px;
    box-shadow: var(--shadow);
  }
  .input-form:focus-within { border-color: var(--primary-light); }
  .input-form input {
    flex: 1;
    border: none; outline: none;
    font-family: var(--font-sans);
    font-size: 14px;
    background: transparent;
  }
  .input-form button {
    border: none;
    border-radius: 999px;
    padding: 8px 20px;
    background: var(--primary);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--font-sans);
  }
  .input-form button:hover { background: var(--primary-light); }
  .input-form button:disabled { opacity: 0.5; }
</style>
</head>
<body>

  <header><h1>倪师辨证助手</h1></header>
  <div class="note">仅供中医知识学习参考，不构成诊疗建议</div>

  <main class="chat-area" id="chat-area"></main>

  <footer class="input-bar">
    <form class="input-form" id="input-form">
      <input type="text" id="question-input" placeholder="描述不适，如：头痛怕冷不出汗…" autocomplete="off" autofocus>
      <button type="submit" id="submit-btn">发送</button>
    </form>
  </footer>

  <script>
    const chatArea = document.getElementById('chat-area');
    const inputForm = document.getElementById('input-form');
    const questionInput = document.getElementById('question-input');
    const submitBtn = document.getElementById('submit-btn');

    function render(text) {
      return text
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/【(辨证方向|类方思路|倪师讲解|调理建议|就医引导)】/g, (m, p1) => {
          const cls = {
            '辨证方向': 'layer layer-diag', '类方思路': 'layer layer-family',
            '倪师讲解': 'layer layer-guide', '调理建议': 'layer layer-tip',
            '就医引导': 'layer layer-care',
          }[p1] || 'layer';
          return `<div class="${cls}">${p1}</div>`;
        })
        .replace(/\n/g, '<br>');
    }

    function escapeHtml(t) {
      const d = document.createElement('div');
      d.textContent = t;
      return d.innerHTML;
    }

    function clarifyCard(diag, question) {
      const opts = (diag.options || []).map(o =>
        `<button class="diag-option" data-a="${escapeHtml(o)}">${escapeHtml(o)}</button>`).join('');
      const card = document.createElement('div');
      card.className = 'diag-card';
      card.innerHTML = `<div class="diag-title">${escapeHtml(diag.question || '请补充')}</div>
        <div class="diag-options">${opts}</div>
        ${opts ? '' : '<div class="diag-hint">如：有/没有出汗、怕冷还是怕热…</div>'}`;
      card.querySelectorAll('.diag-option').forEach(b => {
        b.addEventListener('click', () => {
          questionInput.value = `${question}，${b.dataset.a}`;
          inputForm.dispatchEvent(new Event('submit'));
        });
      });
      return card;
    }

    inputForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const q = questionInput.value.trim();
      if (!q || submitBtn.disabled) return;

      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      userMsg.innerHTML = `<div class="avatar">你</div><div class="bubble">${escapeHtml(q)}</div>`;
      chatArea.appendChild(userMsg);
      questionInput.value = '';
      submitBtn.disabled = true;

      const aiMsg = document.createElement('div');
      aiMsg.className = 'message ai';
      aiMsg.innerHTML = `<div class="avatar">🌿</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
      chatArea.appendChild(aiMsg);
      chatArea.scrollTop = chatArea.scrollHeight;
      const bubble = aiMsg.querySelector('.bubble');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: q }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: '请求失败' }));
          bubble.className = 'bubble error';
          bubble.textContent = err.detail || '请求失败';
          return;
        }
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let answer = '', buf = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const lines = buf.split('\n');
          buf = lines.pop() || '';

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            let d;
            try { d = JSON.parse(line.slice(6)); } catch { continue; }

            if (d.type === 'retrieved') {
              bubble._extras = d.context_extras;
              bubble._question = q;
              if ((d.context_extras || {}).diagnosis?.status === 'need_clarification') {
                bubble._clarify = true;
              }
            } else if (d.type === 'chunk') {
              if (bubble._answerDone) continue;
              if (bubble._clarify) {
                bubble._clarify = false;
                bubble.innerHTML = '';
                const diag = (bubble._extras || {}).diagnosis;
                if (diag) bubble.appendChild(clarifyCard(diag, bubble._question));
                bubble._answerDone = true;
              } else {
                answer += d.content;
                bubble.innerHTML = render(answer);
              }
            } else if (d.type === 'error') {
              bubble.className = 'bubble error';
              bubble.textContent = d.message || '生成失败';
            }
          }
          chatArea.scrollTop = chatArea.scrollHeight;
        }
      } catch (err) {
        bubble.className = 'bubble error';
        bubble.textContent = '连接失败';
      } finally {
        submitBtn.disabled = false;
        questionInput.focus();
      }
    });

    questionInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        inputForm.dispatchEvent(new Event('submit'));
      }
    });
  </script>
</body>
</html>
